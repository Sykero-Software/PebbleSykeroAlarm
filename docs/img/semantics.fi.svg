<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Herätysajan kolme merkitystä">
  <style>
    .sfc{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .grid{stroke:#dcdcd8} .s1{fill:#2a78d6} .s1s{stroke:#2a78d6}
    .s2{fill:#eb6834} .s2s{stroke:#eb6834}
    .s3{fill:#1baf7a} .s3s{stroke:#1baf7a} .band{fill:#e8eff9}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark) {
      .sfc{fill:#1a1a19} .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .grid{stroke:#3a3a37} .s1{fill:#3987e5} .s1s{stroke:#3987e5}
      .s2{fill:#d95926} .s2s{stroke:#d95926}
      .s3{fill:#199e70} .s3s{stroke:#199e70} .band{fill:#22304180}
    }
  </style>
<rect class="sfc" width="900" height="330"/><text x="24.0" y="24.0" class="ink" font-size="15" text-anchor="start" font-weight="600">Mitä herätysaika tarkoittaa</text><text x="24.0" y="42.0" class="ink2" font-size="12" text-anchor="start" font-weight="normal">Herätys 07:50 ja 30 minuutin ikkuna. T on asettamasi aika.</text><text x="24.0" y="96.0" class="ink" font-size="13" text-anchor="start" font-weight="600">Viimeisin hetki</text><text x="24.0" y="112.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">voi soida aiemmin</text><line x1="150.0" y1="92.0" x2="870.0" y2="92.0" class="grid" stroke-width="1"/><rect x="240.0" y="81.0" width="270.00" height="22.00" class="band" rx="3"/><text x="375.0" y="97.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">voi soida missä tahansa tässä</text><line x1="510.0" y1="72.0" x2="510.0" y2="112.0" class="s2s" stroke-width="2"/><text x="150.0" y="124.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">Tarkkailee 07:20–07:50 ja soittaa ensimmäisellä hyvällä hetkellä; viimeistään 07:50.</text><text x="24.0" y="168.0" class="ink" font-size="13" text-anchor="start" font-weight="600">Aikaisin hetki</text><text x="24.0" y="184.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">voi soida myöhemmin</text><line x1="150.0" y1="164.0" x2="870.0" y2="164.0" class="grid" stroke-width="1"/><rect x="510.0" y="153.0" width="270.00" height="22.00" class="band" rx="3"/><text x="645.0" y="169.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">voi soida missä tahansa tässä</text><line x1="510.0" y1="144.0" x2="510.0" y2="184.0" class="s2s" stroke-width="2"/><text x="150.0" y="196.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">Ei soi koskaan ennen 07:50, ja soi viimeistään 08:20.</text><text x="24.0" y="240.0" class="ink" font-size="13" text-anchor="start" font-weight="600">Silloin täysin hereillä</text><text x="24.0" y="256.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">alkaa aiemmin</text><line x1="150.0" y1="236.0" x2="870.0" y2="236.0" class="grid" stroke-width="1"/><rect x="240.0" y="225.0" width="270.00" height="22.00" class="band" rx="3"/><text x="375.0" y="241.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">voimistuminen rakentuu</text><line x1="510.0" y1="216.0" x2="510.0" y2="256.0" class="s2s" stroke-width="2"/><text x="150.0" y="268.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">Alkaa niin aikaisin, että herätys on täydessä voimassaan 07:50.</text><text x="510.0" y="74.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">T = 07:50</text><text x="24.0" y="316.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">Älyherätyksen sammuttaminen saa kaikki kolme soimaan tasan hetkellä T.</text></svg>
