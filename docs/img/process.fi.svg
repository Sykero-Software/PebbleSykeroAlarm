<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Milloin herätyssovellus todella käy yön aikana">
  <style>
    .sfc{fill:#fcfcfb} .ink{fill:#0b0b0b} .ink2{fill:#52514e}
    .grid{stroke:#dcdcd8} .s1{fill:#2a78d6} .s1s{stroke:#2a78d6}
    .s2{fill:#eb6834} .s2s{stroke:#eb6834}
    .s3{fill:#1baf7a} .s3s{stroke:#1baf7a} .band{fill:#e8eff9}
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
    @media (prefers-color-scheme: dark) {
      .sfc{fill:#1a1a19} .ink{fill:#ffffff} .ink2{fill:#c3c2b7}
      .grid{stroke:#3a3a37} .s1{fill:#3987e5} .s1s{stroke:#3987e5}
      .s2{fill:#d95926} .s2s{stroke:#d95926}
      .s3{fill:#199e70} .s3s{stroke:#199e70} .band{fill:#22304180}
    }
  </style>
<rect class="sfc" width="900" height="250"/><text x="24.0" y="24.0" class="ink" font-size="15" text-anchor="start" font-weight="600">Sovellus nukkuu lähes koko yön</text><text x="24.0" y="42.0" class="ink2" font-size="12" text-anchor="start" font-weight="normal">Sillä ei ole taustasäiettä. Kaikki alla oleva on kello herättämässä sen ajastimella, jonka se itse asetti.</text><line x1="70.0" y1="130.0" x2="850.0" y2="130.0" class="grid" stroke-width="2"/><rect x="798.0" y="122.0" width="39.00" height="16.00" class="band" rx="3"/><line x1="70.0" y1="114.0" x2="70.0" y2="146.0" class="s1s" stroke-width="2"/><circle cx="70.0" cy="130.0" r="5" class="s1"/><text x="70.0" y="104.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">22:00</text><text x="70.0" y="164.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">asetat herätyksen; sovellus</text><text x="70.0" y="179.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">virittää herätyksensä</text><line x1="460.0" y1="114.0" x2="460.0" y2="146.0" class="s1s" stroke-width="2"/><circle cx="460.0" cy="130.0" r="5" class="s1"/><text x="460.0" y="104.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">03:00</text><text x="460.0" y="164.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">kellotarkistus: virittää kaiken</text><text x="460.0" y="179.0" class="ink2" font-size="11" text-anchor="middle" font-weight="normal">uudelleen kellonsiirron jälkeen</text><line x1="798.0" y1="114.0" x2="798.0" y2="146.0" class="s3s" stroke-width="2"/><circle cx="798.0" cy="130.0" r="5" class="s3"/><text x="798.0" y="104.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">07:20</text><line x1="837.0" y1="114.0" x2="837.0" y2="146.0" class="s2s" stroke-width="2"/><circle cx="837.0" cy="130.0" r="5" class="s2"/><text x="837.0" y="104.0" class="ink" font-size="12" text-anchor="middle" font-weight="600">07:50</text><text x="850.0" y="54.0" class="ink2" font-size="11" text-anchor="end" font-weight="normal">ikkuna auki: sovellus herää 3 minuutin välein,</text><text x="850.0" y="69.0" class="ink2" font-size="11" text-anchor="end" font-weight="normal">katsoo liikehistoriaa ja soittaa ensimmäisellä</text><text x="850.0" y="84.0" class="ink2" font-size="11" text-anchor="end" font-weight="normal">hyvällä hetkellä – tai 07:50 joka tapauksessa</text><text x="24.0" y="210.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">Näiden hetkien välissä sovellus ei ole käynnissä, ja juuri siksi liikedata LUETAAN JÄLKIKÄTEEN laiteohjelmiston omasta historiasta</text><text x="24.0" y="226.0" class="ink2" font-size="11" text-anchor="start" font-weight="normal">eikä kerätä livenä: kello tallensi koko yön riippumatta siitä, oliko sovellus hereillä.</text></svg>
